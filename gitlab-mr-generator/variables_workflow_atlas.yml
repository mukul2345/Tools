# CI/CD variables for the workflow-atlas service (internal; deployed like verification-workflow-engine).
# Modelled on variables_new_service.yml. Run: node add_cicd_variables.js --config variables_workflow_atlas.yml --dry-run

# --- Global defaults (can be overridden per variable) ---
# These apply to all variables unless overridden in individual variable definitions

# Variable type: 'env_var' (environment variable) or 'file' (file type)
variable_type: env_var

# Whether the variable is protected (only available on protected branches/tags)
protected: false

# Whether the variable is masked (hidden in job logs)
masked: false

# Whether the variable is raw (no variable expansion)
raw: false

# Environment scope: '*' for all environments, or specific environment name
environment_scope:
  - "develop"
  - "staging"
  - "preprod"
  - "production"
  - "training"

# --- Variables to add/update/delete ---
# Each variable must have a 'key' and optionally 'value'
# Individual variables can override any global setting
variables:
  - key: "WHITELIST"
    value: "true"
  - key: "SERVICE_NAME"
    value: "workflow-atlas"
  - key: "PUSH_TO_CLOUDWATCH"
    value: "true"
  - key: "PRODUCT"
    value: "common"
  - key: "PORT"
    value: "80"
  - key: "NODE_ENV"
    value: "develop"
    environment_scope: "develop"
  - key: "NODE_ENV"
    value: "staging"
    environment_scope: "staging"
  - key: "NODE_ENV"
    value: "preprod"
    environment_scope: "preprod"
  - key: "NODE_ENV"
    value: "qa"
    environment_scope: "training"
